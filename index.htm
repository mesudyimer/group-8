<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration form</title>
</head>
<body>
    <h1>Well-comme To woldia university</h1>
    <p class="para">please fill the form bellow carefully </p>
    <form action="">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="e.g Abebe">
        <label for="id">ID</label>
        <input type="password" id="id">
        <p>Department:</p>
        <select name="" id="">
            <option value="" selected disabled>select your department</option>
            <option value="software">software</option>
            <option value="cs">computer science</option>
            <option value="it">Information Technology</option>
            <option value="CE">computer enginerring</option>
        </select>
        <label for="Year">Please enter Acadamic Year</label>
        <input type="date" id="year">
        <label for="gread">please upload your last year gread report</label>
        <input type="file" id="gread">
        </form>
        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
</body>
</html>
